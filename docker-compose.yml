services:
  studio:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      GOOGLE_CLIENT_SECRETS_FILE: /app/secrets/client_secret.json
      YOUTUBE_TOKEN_FILE: /app/secrets/youtube_token.json
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    restart: unless-stopped
